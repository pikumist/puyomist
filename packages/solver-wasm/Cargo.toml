[package]
name = "solver-wasm"
version = "0.1.0"
authors = ["pikumist <174439048+pikumist@users.noreply.github.com>"]
description = "A puyoque chain simulator with wasm-pack"
license = "MIT/Apache-2.0"
repository = "https://github.com/pikumist/puyomist/packages/solver-wasm"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]
name = "solver"
path = "src/lib.rs"

[features]
default = ["console_error_panic_hook"]
# ネイティブ (BMI2/PEXT) の探索をローカルWebSocketサーバーとして提供する任意機能。
# wasm-pack build (default features) には一切影響しない。
server = ["dep:tungstenite", "dep:serde_json"]

[dependencies]
wasm-bindgen = "0.2"
approx = "0.5.1"
bitintr = "0.3.0"
indexmap = { version = "2.2", features = ["serde"] }
rayon = "1.10"
num-traits = "0.2"
num-derive = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_repr = "0.1"
smallvec = { version = "1", features = ["serde", "union"] }
serde-wasm-bindgen = "0.6"
console_error_panic_hook = { version = "0.1.7", optional = true }
# "server" フィーチャー限定 (ローカルのみで動くネイティブサーバー用)。
tungstenite = { version = "0.29", optional = true }
serde_json = { version = "1.0", optional = true }

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "benchmark"
harness = false

[[bin]]
name = "solver-server"
path = "src/bin/solver_server.rs"
required-features = ["server"]